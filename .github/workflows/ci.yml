# Checks every pull request without touching AWS (decision 039): the agent's offline tests, the
# frontend build, and `cdk synth` for every stack. deploy.yml runs this first and stops if it fails.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-tests:
    name: Agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: pip install -r agent/requirements.txt -r agent/requirements-dev.txt
      - name: Offline unit tests
        working-directory: agent
        run: python -m pytest -q tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build

  cdk-synth:
    name: CDK synth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r infra/requirements.txt
      - name: Synthesize every stack
        working-directory: infra
        run: npx --yes aws-cdk@2 synth --all --quiet -c knowledge_base_id=VICX17XM3C --app "python app.py"
