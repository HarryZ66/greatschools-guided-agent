# Deploys `main` to the AWS sandbox after every merge (decision 039): CI first, then GsDataStack and
# GsAppStack, then the live smoke test against the CloudFront URL. Also runnable by hand from the
# Actions tab. GitHub signs in to AWS with OIDC (infra/stacks/ci_stack.py): no AWS keys in GitHub.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "evals/results/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # lets the job ask GitHub for the OIDC token AWS trusts

concurrency:  # one deploy at a time; a newer merge waits instead of cancelling a running deploy
  group: deploy-sandbox
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # The workshop sandbox account and its GitHub deploy role (GsCiStack). Change both to deploy elsewhere.
  AWS_ROLE: arn:aws:iam::205930628752:role/GsGitHubDeployRole
  KNOWLEDGE_BASE_ID: VICX17XM3C  # the GsKnowledgeStack output; GsAppStack drops the guide's KB wiring without it

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to the sandbox
    needs: ci
    runs-on: ubuntu-24.04-arm  # the agent images are ARM64; building on ARM avoids slow emulation
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - name: Build the parent app (CDK uploads frontend/dist)
        working-directory: frontend
        run: npm ci && npm run build
      - run: pip install -r infra/requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk deploy GsDataStack GsAppStack
        working-directory: infra
        run: >
          npx --yes aws-cdk@2 deploy GsDataStack GsAppStack --exclusively
          -c knowledge_base_id=$KNOWLEDGE_BASE_ID --require-approval never
          --app "python app.py" --outputs-file cdk-outputs-ci.json
      - name: Smoke test the live site
        run: |
          url=$(python -c "import json; print(json.load(open('infra/cdk-outputs-ci.json'))['GsAppStack']['AppUrl'])")
          echo "Testing $url"
          python evals/smoke_api.py "$url"
