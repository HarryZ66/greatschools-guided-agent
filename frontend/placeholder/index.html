<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guided Agent API test page</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --card: #fff; --line: #e3e3de;
          --ok: #1f7a4d; --part: #9a6a00; --bad: #b3261e; --miss: #6b6b66; --accent: #2c5cc5; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; }
  button { padding: 8px 14px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chips, .opts { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13px; }
  .chip.require { border-color: var(--accent); }
  .chip.unmapped { color: var(--muted); border-style: dashed; }
  .chip.suggested { color: var(--accent); border-style: dashed; cursor: pointer; font: inherit; font-size: 13px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .callout { border-left: 3px solid var(--part); }
  .card h3 { margin: 0 0 2px; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; }
  .crit { display: grid; grid-template-columns: 20px 1fr; gap: 2px 6px; margin-top: 8px; font-size: 14px; }
  .confirmed { color: var(--ok); } .partial { color: var(--part); } .needs_attention { color: var(--bad); } .missing { color: var(--miss); }
  .watch { margin-top: 8px; font-size: 13px; color: var(--bad); }
  .status { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .trace summary { cursor: pointer; font-weight: 600; }
  .trace ol { margin: 8px 0 0; padding-left: 20px; font-size: 13px; }
  .trace .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Guided Agent: API test page</h1>
  <p class="sub">A stand-in until the real frontend is deployed. It calls <code>/api/turn</code> on this same URL.</p>
  <form id="f"><input id="q" placeholder="e.g. middle school near Miami, he loves robotics, I work until 6pm" autocomplete="off"><button class="primary">Ask</button></form>
  <div class="status" id="status"></div>
  <div id="out"></div>
</main>
<script>
const ICON = { confirmed: "✅", partial: "◐", needs_attention: "⚠️", missing: "❔" };
let sessionId = null;
const out = document.getElementById("out"), status = document.getElementById("status");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Uses the streaming endpoint so progress ("Checked 9 schools…") shows while the agent works.
async function send(event) {
  status.textContent = "Checking schools for you…";
  try {
    const r = await fetch("/api/turn/stream", { method: "POST", headers: { "content-type": "application/json" },
                                                body: JSON.stringify({ session_id: sessionId, event }) });
    if (!r.ok || !r.body) throw new Error(`server returned ${r.status}: ${(await r.text()).slice(0, 120)}`);
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const line = buffer.slice(0, cut).split("\n").find(l => l.startsWith("data: "));
        buffer = buffer.slice(cut + 2);
        if (!line) continue;
        const msg = JSON.parse(line.slice(6));
        if (msg.type === "progress") status.textContent = msg.text;
        else if (msg.type === "error") throw new Error(msg.detail);
        else if (msg.type === "result") {
          sessionId = msg.response.session_id;
          status.textContent = `Answered in ${(msg.response.elapsed_ms / 1000).toFixed(1)}s`;
          render(msg.response.blocks, msg.response.trace);
        }
      }
    }
  } catch (e) { status.textContent = "Error: " + e.message; }
}

function render(blocks, trace) {
  out.innerHTML = "";
  for (const b of blocks) {
    const el = document.createElement("div");
    if (b.type === "criteria_chips") {
      el.className = "chips";
      el.innerHTML = b.chips.map(c => `<span class="chip ${c.mode}">${c.mode === "require" ? "Must: " : c.mode === "avoid" ? "Avoid: " : ""}${esc(c.label)}</span>`).join("")
        + (b.unmapped || []).map(u => `<span class="chip unmapped" title="We can't check this yet">${esc(u)} (can't check)</span>`).join("")
        + (b.suggested || []).map(s => `<button class="chip suggested" data-need="${esc(s.need)}" title="${esc(s.why)}">+ ${esc(s.label)}</button>`).join("");
      el.querySelectorAll("button.suggested").forEach(btn => btn.onclick = () => send({ type: "chip_edit", need: btn.dataset.need, mode: "prefer" }));
    } else if (b.type === "text") {
      el.className = "box";
      el.innerHTML = esc(b.markdown) + (b.sources ? `<div class="meta" style="margin-top:6px">From the guide: ${b.sources.map(s => esc(s.title)).join(" · ")}</div>` : "");
    } else if (b.type === "clarifying_question") {
      el.className = "box";
      el.innerHTML = `<strong>${esc(b.text)}</strong><div class="opts">${b.options.map(o => `<button data-opt="${esc(o.id)}">${esc(o.label)}</button>`).join("")}</div>`;
      el.querySelectorAll("button").forEach(btn => btn.onclick = () => send({ type: "answer", question_id: b.question_id, option_id: btn.dataset.opt }));
    } else if (b.type === "evidence_callout") {
      el.className = "box callout"; el.textContent = b.text;
    } else if (b.type === "school_results") {
      el.innerHTML = b.results.map(r => `<div class="box card"><h3>${r.rank}. ${esc(r.name)}</h3>
        <div class="meta">${esc(r.entity_type)} · ${esc(r.city)} · match ${(r.score * 100).toFixed(0)}%</div>
        <div class="crit">${r.criteria.map(c => `<span>${ICON[c.status]}</span><span class="${c.status}">${esc(c.need.replace(/_/g, " "))}${c.note ? ": " + esc(c.note) : ""}</span>`).join("")}</div>
        ${r.watch_out ? `<div class="watch">Watch out: ${esc(r.watch_out)}</div>` : ""}</div>`).join("");
    } else if (b.type === "program_results") {
      el.innerHTML = `<div class="meta" style="margin:12px 0 4px">Programs nearby (run by libraries and community centers)</div>` +
        b.programs.map(p => `<div class="box card"><h3>${esc(p.name)}</h3>
        <div class="meta">${esc(p.organization)} · ${esc(p.city)} · ${p.distance_km} km from ${esc(p.near)} · ${esc(p.ages)} · ${esc(p.cost)}${p.registration_open ? " · registration open" : ""}</div>
        <div class="crit"><span>📅</span><span>Meets ${esc((p.meets_on || []).join(", "))}. Next: ${p.next_sessions.map(s => `${esc(s.day)} ${esc(s.date.slice(5))} ${esc(s.start)}–${esc(s.end)}`).join(", ")}</span>
        ${p.time_fit ? `<span>${ICON[p.time_fit.status]}</span><span class="${p.time_fit.status}">${esc(p.time_fit.note)}</span>` : ""}</div>
        ${p.quality_flags.length ? `<div class="watch">Watch out: ${p.quality_flags.map(f => esc(f.note)).join(" ")}</div>` : ""}</div>`).join("");
    } else if (b.type === "comparison") {
      el.className = "box"; el.textContent = b.summary || "";
    }
    out.appendChild(el);
  }
  if (trace && trace.steps.length) {  // what really ran this turn, recorded by code
    const el = document.createElement("details");
    el.className = "box trace";
    el.innerHTML = `<summary>How I checked this (${trace.steps.length} steps)</summary><ol>` +
      trace.steps.map(s => `<li><b>${esc(s.service)}</b>: ${esc(s.text)}${s.ms != null ? ` <span class="muted">${s.ms} ms</span>` : ""}</li>`).join("") +
      "</ol>";
    out.appendChild(el);
  }
}

document.getElementById("f").onsubmit = e => {
  e.preventDefault();
  const text = document.getElementById("q").value.trim();
  if (text) send({ type: "query", text });
};
</script>
</body>
</html>
